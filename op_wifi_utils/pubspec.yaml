name: op_wifi_utils
description: A lightweight Flutter plugin using modern Android and iOS APIs to connect to Wi-Fi, disconnect, and retrieve the current SSID, based on OpResult for structured error handling.
version: 1.5.0
homepage: https://pub.dev/packages/op_wifi_utils

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  op_result: ">=0.3.0 <0.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.cantini.op_wifi_utils
        pluginClass: OpWifiUtilsPlugin
      ios:
        pluginClass: SwiftOpWifiUtilsPlugin